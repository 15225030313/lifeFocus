# 生活奇观资讯网站 · Nginx 站点配置
# 用法：
#   sudo cp nginx-life-focus.conf /etc/nginx/sites-available/life-focus
#   sudo ln -s /etc/nginx/sites-available/life-focus /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 说明：后端已在 8000 端口统一托管前端 dist 与 /api，
#       本配置只做 “HTTPS 入口 + 反向代理”，与本地 localhost:8000 行为一致。

# HTTP 强制跳转 HTTPS
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    return 301 https://$host$request_uri;
}

# HTTPS 主站点
server {
    listen 443 ssl;
    server_name your-domain.com www.your-domain.com;

    # === 改成你自己的证书路径（腾讯云 SSL 控制台下载的 Nginx 格式）===
    ssl_certificate     /etc/nginx/ssl/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/your-domain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 上传图片最大 10MB
    client_max_body_size 10m;

    # 全量反代到后端（前端页面 /api /static 全部经此）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
